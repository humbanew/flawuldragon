<style>
  html,
  html>iframe {
    display: flex;
    justify-content: center;
    width: 100%;

  body {
    display: flex;
    flex-direction: column;
    background: linear-gradient(to bottom, #2c79c8, #121212);
    border: 0;
    margin: 0;
    padding: 0;
    height: 100vh;
    width: 100%;
    color: white;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  body h2 {
    height: 100%;
    font-weight: 300;
    padding: 2rem;
  }

  .flawuldragon-notes_display_titulo {
    align-items: center;
    background: linear-gradient(to right, #2c79c8cc, #0f64bbcc, #105ba7cc);
    display: flex;
    gap: 0.2rem;
    padding-left: 1rem;
    width: calc(100% - 1rem);
    box-shadow: #12121244 0px 0px 10px;

    position: sticky;
    position-try: sticky;
    top: 0;
    z-index: 1000;
  }

  .flawuldragon-notes_display_titulo svg {
    width: 50px;
    height: 50px;
  }

  .flawuldragon-notes_display_categorias {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    width: calc(100%-2rem);
  }

  .flawuldragon-notes_display_categorias__card {
    box-shadow: 0px 4px 12px #00000066;
    display: flex;
    flex-wrap: wrap;
    padding: 1rem;
    width: 80%;
  }

  .flawuldragon-notes_display_categorias__card:nth-child(1) {
    background-color: #7cbdff;
    border-top-left-radius: 4px;
    border-top-right-radius: 4px;
    margin-top: 2rem;
  }

  .flawuldragon-notes_display_categorias__card:nth-child(2) {
    background-color: #5eafff;
  }

  .flawuldragon-notes_display_categorias__card:nth-child(3) {
    background-color: #409ffd;
  }

  .flawuldragon-notes_display_categorias__card:nth-child(4) {
    background-color: #2892fc;
  }

  .flawuldragon-notes_display_categorias__card:nth-child(5) {
    background-color: #0075eb;
  }

  .flawuldragon-notes_display_categorias__card:nth-child(6) {
    background-color: #0052a3;
    border-bottom-left-radius: 4px;
    border-bottom-right-radius: 4px;
  }

  .flawuldragon-notes_display_categorias__card___conteudo {
    width: 100%;
  }

  .flawuldragon-notes_display_rodape {
    display: flex;
    vertical-align: bottom;
    justify-content: center;
    margin-top: 2rem;
    width: calc(100%-2rem);
  }

  .flawuldragon-notes_display_rodape__card {
    align-items: baseline;
    background-color: #0f64bb55;
    box-shadow: #cccccc44 0px -2px 6px;
    display: flex;
    justify-content: center;
    padding: 1rem;
    position: sticky;
    bottom: 0;
    gap: 0.5rem;
    width: 94%;
  }

  .flawuldragon-notes_display_rodape__card>svg {
    width: 85px;
    height: 14px;
  }
</style>
