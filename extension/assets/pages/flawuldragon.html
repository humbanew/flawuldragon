  <style>
    /*scrollbar*/
    *::-webkit-scrollbar-track-piece {
      background-color: #0f64bb00;
      height: 4px;
      width: 4px;
    }

    *::-webkit-scrollbar-thumb {
      background-color: #0f64bb00;
      border-radius: 3px;
    }

    section::-webkit-scrollbar-thumb,
    div::-webkit-scrollbar-thumb {
      transition: ease-in-out 0.4s;
    }

    *::-webkit-scrollbar {
      height: 4px;
      width: 4px;
    }

    section:hover::-webkit-scrollbar-thumb,
    div:hover::-webkit-scrollbar-thumb,
    section:focus::-webkit-scrollbar-thumb,
    div:focus::-webkit-scrollbar-thumb,
    section:active::-webkit-scrollbar-thumb,
    div:active::-webkit-scrollbar-thumb {
      background-color: #0f64bb;
    }

    /*html e iframe do visual studio code*/
    html,
    html > iframe {
      display: flex;
      height: 100%;
      justify-content: center;
      width: 100%;
    }

    /*cabecalho*/
    .flawuldragon-notes_display__titulo {
      align-items: center;
      background: linear-gradient(to right, #2c79c8cc, #0f64bbcc, #105ba7cc);
      display: flex;
      gap: 0.2rem;
      padding-left: 1rem;
      width: calc(100% - 1rem);
      box-shadow: #12121244 0px 0px 10px;
      position: sticky;
      position: -webkit-sticky;
      top: 0;
      z-index: 1000;
    }

    .flawuldragon-notes_display__titulo svg {
      width: 40px;
      height: 40px;
      margin-right: 0.5rem;
    }

    /*corpo*/
    .flawuldragon-notes_display {
      display: flex;
      flex-direction: column;
      background: linear-gradient(to bottom, #2c79c8, #121212) no-repeat;
      width: 100%;
      height: 100%;
      color: white;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      border: 0;
      margin: 0;
      padding: 0;
    }

    /*corpo container*/
    #key {
      background-color: #2c282c;
    }

    #fea {
      background-color: #2e272a;
    }

    #cha {
      background-color: #3c302f;
    }

    .flawuldragon-notes_display__container {
      display: flex;
      flex-direction: row;
      gap: 1rem;
      overflow-x: scroll;
      margin: 0 1.6rem;
      padding-bottom: 1rem;
      height: 100%;
    }

    .flawuldragon-notes_display__container___card {
      display: flex;
      flex-direction: column;
    }

    .flawuldragon-notes_display__container___card____titulo {
      font-weight: 300;
    }

    .flawuldragon-notes_display__container___card____conteudo {
      background-color: #27272a;
      border-radius: 3px;
      box-shadow: 0px 0px 8px #1f1f1f88;
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 0 0.5rem;
      width: 400px;
      vertical-align: top;
      overflow-y: scroll;
      overflow-x: hidden;
    }

    /*corpo container incorporacoes*/
    .flawuldragon-notes_display__container___card____conteudo_card_int_item {
      background-color: #2c79c855;
      display: flex;
      flex-direction: column;
      margin: 0.5rem 0;
    }

    .flawuldragon-notes_display__container___card____conteudo_card_int_item__titulo {
      margin-left: 0.5rem;
      width: 96%;
    }

    .flawuldragon-notes_display__container___card____conteudo_card_int_item__subtitulo {
      font-weight: 100;
      font-size: 0.8rem;
      margin-left: 0.2rem;
    }

    .flawuldragon-notes_display__container___card____conteudo_card_int_item__btn_container {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
    }

    .flawuldragon-notes_display__container___card____conteudo_card_int_item__btn_container_anchor {
      text-align: center;
      align-items: center;
      width: 50%;
      margin: 0;
      color: white !important;
      text-decoration: none;
    }

    .flawuldragon-notes_display__container___card____conteudo_card_int_item__btn_container___mkpc,
    .flawuldragon-notes_display__container___card____conteudo_card_int_item__btn_container___lctm {
      padding: 1rem;
      transition: ease-in-out 0.4s;
      margin: 0;
    }

    .flawuldragon-notes_display__container___card____conteudo_card_int_item__btn_container___mkpc {
      background-color: #2c79c8;
    }

    .flawuldragon-notes_display__container___card____conteudo_card_int_item__btn_container___lctm {
      background-color: #2c79c8cc;
    }

    .flawuldragon-notes_display__container___card____conteudo_card_int_item__btn_container___mkpc:hover,
    .flawuldragon-notes_display__container___card____conteudo_card_int_item__btn_container___lctm:hover {
      transform: translateY(-4px);
      box-shadow: 0px 2px 4px #1f1f1f88;
      font-weight: 500;
    }

    /*corpo container keybindings*/
    .flawuldragon-notes_display__container___card____conteudo#key {
      display: flex;
      align-items: center;
    }

    .flawuldragon-notes_display__container___card____conteudo_card_key_item {
      align-items: left;
      background-color: #27272fcc;
      border-radius: 3px;
      display: flex;
      flex-direction: column;
      width: 100%;
      margin-top: 0.5rem;
    }

    .flawuldragon-notes_display__container___card____conteudo_card_key_item__teclas {
      margin: 0.5rem 1rem;
    }

    .flawuldragon-notes_display__container___card____conteudo_card_key_item__ambiente {
      font-size: 0.8rem;
      font-weight: 500;
      color: #95baff;
      border: 1px solid #95baff;
      margin-left: 0.5rem;
      padding: 0.2rem;
      border-radius: 10px;
    }

    .flawuldragon-notes_display__container___card____conteudo_card_key_item__descricao {
      margin: 0 1rem 1rem 1rem;
    }

    /*corpo container features*/
    .flawuldragon-notes_display__container___card____conteudo_card_fea_item {
      background-color: #0f64bb55;
      border-radius: 0.1rem;
      color: white;
      font-weight: 500;
      padding: 0.5rem;
      margin: 0.5rem;
    }

    /*corpo container changelog*/
    .flawuldragon-notes_display__container___card____conteudo#cha {
      width: 600px;
    }

    .flawuldragon-notes_display__container___card____conteudo_changelog__card {
      display: flex;
      flex-direction: column;
      border-radius: 5px;
      padding: 0.4rem;
      margin-top: 0.1rem;
      padding-top: 0;
    }

    .flawuldragon-notes_display__container___card____conteudo_changelog__card_titulo,
    .flawuldragon-notes_display__container___card____conteudo_changelog__card_subtitulo {
      color: #99c0e7cc;
    }

    .flawuldragon-notes_display__container___card____conteudo_changelog__card_titulo {
      font-size: 1.6rem;
      font-weight: 600;
      margin-top: 0.5rem;
      margin-bottom: 0.5rem;
      padding: 0;
    }

    .flawuldragon-notes_display__container___card____conteudo_changelog__card_subtitulo {
      font-size: 1rem;
      font-weight: 400;
      margin-top: 0.1rem;
      margin-left: 0.4rem;
      padding: 0;
    }

    .flawuldragon-notes_display__container___card____conteudo_changelog__card_lista {
      list-style-type: "⫗ ";
      margin: 0;
      padding-left: 1.8rem;
      text-align: left;
      margin-bottom: 0.4rem;
    }

    /* rodape */
    .flawuldragon-notes_display__rodape {
      display: flex;
      vertical-align: bottom;
      justify-content: center;
      margin-top: 2rem;
      width: calc(100%-2rem);
    }

    .flawuldragon-notes_display__rodape___card {
      align-items: baseline;
      background-color: #0f64bb55;
      box-shadow: #1f1f1f44 0px 0px 6px;
      border-radius: 5px;
      border-bottom-right-radius: 0;
      border-bottom-left-radius: 0;
      display: flex;
      justify-content: center;
      padding: 1rem;
      position: sticky;
      bottom: 0;
      gap: 0.5rem;
      width: 96%;
    }

    .flawuldragon-notes_display__rodape___card > svg {
      width: 85px;
      height: 14px;
    }

    function ChangelogCard() {
      changelogVersions.forEach((version, index) => {
        let card = document.createElement("div");
        card.classList.add(
          "flawuldragon-notes_display__container___card____conteudo_changelog__card"
        );

        let titulo = document.createElement("h3");
        titulo.classList.add(
          "flawuldragon-notes_display__container___card____conteudo_changelog__card_titulo"
        );
        titulo.textContent = version.versao;

        let subtitulo = document.createElement("span");
        subtitulo.classList.add(
          "flawuldragon-notes_display__container___card____conteudo_changelog__card_subtitulo"
        );
        subtitulo.textContent = version.data;
        titulo.appendChild(subtitulo);

        let lista = document.createElement("ul");
        lista.classList.add(
          "flawuldragon-notes_display__container___card____conteudo_changelog__card_lista"
        );

        changelogNotes[index].forEach((nota) => {
          let item = document.createElement("li");
          item.classList.add(
            "flawuldragon-notes_display__container___card____conteudo_changelog__card_lista__item"
          );
          item.textContent = nota.nota;
          lista.appendChild(item);
        });

        card.appendChild(titulo);
        card.appendChild(lista);

        seccaoRaizCha.appendChild(card);
      });
    }
